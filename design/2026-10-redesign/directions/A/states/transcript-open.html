<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日AI看点 · 逐字稿打开态</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="_shared.css">
</head>
<body>
  <div class="state-page">
    <div class="state-header">
      <span class="state-number">DRAWER</span>
      <h1 class="state-title">逐字稿 · 打开态（桌面）</h1>
    </div>
    <p class="state-paragraph" style="margin-bottom: var(--space-4);">右侧抽屉滑入，遮罩覆盖主内容。点击遮罩或关闭按钮收起。</p>
    <div class="transcript-sheet">
      <div class="transcript-sheet-header">
        <h3 class="transcript-sheet-title">本期逐字稿</h3>
      </div>
      <div class="transcript-sheet-body">
        <div class="transcript-line">
          <span class="transcript-speaker host-a">林</span>
          <div class="transcript-text"><span class="timestamp">00:12</span>{{transcript_sample_a}}</div>
        </div>
        <div class="transcript-line">
          <span class="transcript-speaker host-b">陈</span>
          <div class="transcript-text"><span class="timestamp">00:45</span>{{transcript_sample_b}}</div>
        </div>
        <div class="transcript-line">
          <span class="transcript-speaker host-a">林</span>
          <div class="transcript-text"><span class="timestamp">01:20</span>{{transcript_sample_c}}</div>
        </div>
      </div>
    </div>
  </div>
<script src="_shared.js"></script>
</body>
</html>
