name: Daily Podcast

on:
  schedule:
    - cron: "43 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Episode date (YYYY-MM-DD), default is today"
        required: false
        type: string
      retry:
        description: "Internal: auto-retry pass (do not set manually)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 与 prune_pages.yml 共用同一并发组:两者都会 push main / 部署 gh-pages,
# 手动触发与定时运行不能同时跑,排队等待而不是并行竞争。
concurrency:
  group: podcast-pipeline
  cancel-in-progress: false

jobs:
  stage1:
    name: Stage 1 (fetch → process)
    runs-on: ubuntu-latest
    outputs:
      episode_id: ${{ steps.episode.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync --frozen

      - id: episode
        run: |
          INPUT_DATE="${{ github.event.inputs.date }}"
          if [ -n "$INPUT_DATE" ]; then
            echo "id=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            echo "id=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        env:
          TZ: Asia/Shanghai
        run: |
          EPISODE="${{ steps.episode.outputs.id }}"
          uv run podcast-pipeline --date "$EPISODE"

      - name: Commit brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          EPISODE="${{ steps.episode.outputs.id }}"
          git add data/briefs/
          if git diff --cached --quiet; then
            echo "No brief changes to commit"
          else
            git commit -m "daily: brief $EPISODE [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

  writer:
    name: Stage 3 (script generation)
    needs: stage1
    runs-on: ubuntu-latest
    outputs:
      episode_id: ${{ needs.stage1.outputs.episode_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest brief
        run: git pull origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate script
        env:
          TZ: Asia/Shanghai
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          EPISODE="${{ needs.stage1.outputs.episode_id }}"
          uv run podcast-writer --date "$EPISODE"

      - name: Commit script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          EPISODE="${{ needs.stage1.outputs.episode_id }}"
          git add -f site/episodes/${EPISODE}.txt
          if git diff --cached --quiet; then
            echo "No script changes to commit"
          else
            git commit -m "daily: script $EPISODE [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Script quality stats
        if: always()
        run: |
          EPISODE="${{ needs.stage1.outputs.episode_id }}"
          python3 - "$EPISODE" <<'PYEOF'
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(f"site/episodes/{sys.argv[1]}.txt")
          if not path.exists():
              print(f"script missing: {path}")
              sys.exit(0)
          txt = path.read_text(encoding="utf-8")
          a = len(re.findall(r"^\[Host A\]", txt, re.M))
          b = len(re.findall(r"^\[Host B\]", txt, re.M))
          chars = len(re.sub(r"\s", "", txt))
          ratio = round(b / a, 2) if a else 0
          warns = []
          if chars < 1500:
              warns.append("too short")
          if a == 0 or b == 0:
              warns.append("missing host")
          if ratio and (ratio < 0.5 or ratio > 2.0):
              warns.append("host imbalance")
          line = f"script stats: {chars} chars, HostA={a}, HostB={b}, ratio={ratio}, warnings={warns or 'none'}"
          print(line)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write(f"- {line}\n")
          PYEOF

  report:
    name: Stage 3b (daily report)
    needs: stage1
    runs-on: ubuntu-latest
    outputs:
      episode_id: ${{ needs.stage1.outputs.episode_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest brief
        run: git pull origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate daily report
        env:
          TZ: Asia/Shanghai
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          EPISODE="${{ needs.stage1.outputs.episode_id }}"
          uv run podcast-report --date "$EPISODE"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          EPISODE="${{ needs.stage1.outputs.episode_id }}"
          git add data/reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "daily: report $EPISODE [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

  tts:
    name: Stage 4 (TTS audio)
    needs: writer
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      episode_id: ${{ needs.writer.outputs.episode_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest content
        run: git pull origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y sox libsox-dev ffmpeg

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache CosyVoice
        uses: actions/cache@v4
        with:
          path: |
            ~/cosyvoice_src
            ~/cosyvoice_models
            ~/cosyvoice_venv
          key: cosyvoice-gha-v7

      - name: Setup CosyVoice environment
        run: bash scripts/setup_cosyvoice_env.sh

      - name: Synthesize episode audio
        env:
          TZ: Asia/Shanghai
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          echo "TTS_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          EPISODE="${{ needs.writer.outputs.episode_id }}"
          export COSYVOICE_MODEL_DIR="$HOME/cosyvoice_models/CosyVoice2-0.5B"
          export PYTHONPATH="$HOME/cosyvoice_src:$HOME/cosyvoice_src/third_party/Matcha-TTS"
          # Stage 4: 使用 podcast-tts CLI，但需要特殊 Python 环境
          "$HOME/cosyvoice_venv/bin/python" scripts/gha_tts_cosyvoice.py \
            --script "site/episodes/${EPISODE}.txt" \
            --output "site/episodes/${EPISODE}.mp3" \
            --model-dir "$HOME/cosyvoice_models/CosyVoice2-0.5B"

      - name: Report synthesis duration
        if: always()
        run: |
          if [ -n "${TTS_START_EPOCH:-}" ]; then
            DUR=$(( $(date +%s) - TTS_START_EPOCH ))
            echo "TTS 用时: $((DUR / 60)) 分 $((DUR % 60)) 秒(episode ${{ needs.writer.outputs.episode_id }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "TTS 用时: 未知(合成步骤未记录起点)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 音频只通过 artifact 传递给 publish job，不提交到 main，避免 git 历史膨胀
      - name: Upload episode audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: episode-audio-${{ needs.writer.outputs.episode_id }}
          path: |
            site/episodes/${{ needs.writer.outputs.episode_id }}.mp3
            site/episodes/${{ needs.writer.outputs.episode_id }}/
          if-no-files-found: error

  publish:
    name: Stage 5 (publish site)
    needs: [tts]
    runs-on: ubuntu-latest
    env:
      EPISODE: ${{ needs.tts.outputs.episode_id }}
      MIN_MP3_BYTES: '100000'  # mp3 截断保护阈值(实际单期约 2-3MB)
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest content
        run: git pull origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download episode audio artifact
        uses: actions/download-artifact@v4
        with:
          name: episode-audio-${{ needs.tts.outputs.episode_id }}
          path: site/episodes

      - name: Publish feed and site
        env:
          TZ: Asia/Shanghai
        run: |
          uv run podcast-publish --date "$EPISODE"

      - name: Validate episode artifacts
        env:
          TZ: Asia/Shanghai
        run: |
          python3 - "$EPISODE" <<'PYEOF'
          import json
          import os
          import sys
          from pathlib import Path

          ep = sys.argv[1]
          min_bytes = int(os.environ["MIN_MP3_BYTES"])
          mp3 = Path(f"site/episodes/{ep}.mp3")
          assert mp3.exists(), f"missing {mp3}"
          size = mp3.stat().st_size
          assert size > min_bytes, f"mp3 too small: {size} bytes"
          feed = Path("site/feed.xml").read_text(encoding="utf-8")
          assert f"episodes/{ep}.mp3" in feed, "feed.xml missing episode enclosure"
          index = json.loads(Path("data/episodes.json").read_text(encoding="utf-8"))
          eps = index if isinstance(index, list) else index.get("episodes", [])
          assert any(str(e.get("id")) == ep for e in eps), "episodes.json missing entry"
          print(f"validated {ep}: mp3={size} bytes, threshold={min_bytes}, feed+index ok")
          PYEOF

      - name: Commit site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u site/ data/episodes.json
          if [ -f "site/reports/daily_report_${EPISODE}.md" ]; then git add -f "site/reports/daily_report_${EPISODE}.md"; else echo "No daily report for ${EPISODE}, skipped"; fi
          git add -f "site/episodes/${EPISODE}/playlist.json" 2>/dev/null || echo "No playlist.json for ${EPISODE}, skipped"
          if git diff --cached --quiet; then
            echo "No site changes to commit"
          else
            git commit -m "daily: publish $EPISODE [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Remove .gitignore to ensure ignored files are deployed
        run: rm -f .gitignore

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true

      - name: Verify gh-pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 10
          get_size() {
            local path="$1" n size=""
            for n in 1 2 3; do
              if size=$(gh api "repos/$GH_REPO/contents/$path?ref=gh-pages" --jq '.size' 2>/dev/null); then
                case "$size" in ''|*[!0-9]*) size="";; esac
                if [ -n "$size" ]; then echo "$size"; return 0; fi
              fi
              sleep 20
            done
            echo 0
          }
          SIZE=$(get_size "episodes/$EPISODE.mp3")
          echo "gh-pages $EPISODE.mp3 size: $SIZE"
          if [ "$SIZE" -le "$MIN_MP3_BYTES" ]; then
            echo "::error::$EPISODE.mp3 missing or too small on gh-pages"
            exit 1
          fi
          PLAYLIST=$(get_size "episodes/$EPISODE/playlist.json")
          if [ "$PLAYLIST" -le 0 ]; then
            echo "::error::$EPISODE/playlist.json missing on gh-pages"
            exit 1
          fi
          echo "gh-pages reconciliation OK"

  notify:
    name: Health check & alert
    needs: [stage1, writer, report, tts, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - name: Summarize, alert and auto-retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EPISODE: ${{ needs.stage1.outputs.episode_id }}
          S1: ${{ needs.stage1.result }}
          WRITER: ${{ needs.writer.result }}
          REPORT: ${{ needs.report.result }}
          TTS: ${{ needs.tts.result }}
          PUBLISH: ${{ needs.publish.result }}
          RETRY: ${{ github.event.inputs.retry }}
        run: |
          EPISODE="${EPISODE:-$(TZ=Asia/Shanghai date +%F)}"
          FAILED=""
          if [ "$S1" != "success" ]; then FAILED="$FAILED stage1=$S1"; fi
          if [ "$WRITER" = "failure" ] || [ "$WRITER" = "cancelled" ]; then FAILED="$FAILED writer=$WRITER"; fi
          if [ "$REPORT" = "failure" ] || [ "$REPORT" = "cancelled" ]; then FAILED="$FAILED report=$REPORT"; fi
          if [ "$TTS" = "failure" ] || [ "$TTS" = "cancelled" ]; then FAILED="$FAILED tts=$TTS"; fi
          if [ "$PUBLISH" = "failure" ] || [ "$PUBLISH" = "cancelled" ]; then FAILED="$FAILED publish=$PUBLISH"; fi

          {
            echo "## Daily Podcast 健康报告 — $EPISODE"
            echo ""
            echo "| job | 结果 |"
            echo "|---|---|"
            echo "| stage1 | $S1 |"
            echo "| writer | $WRITER |"
            echo "| report | $REPORT |"
            echo "| tts | $TTS |"
            echo "| publish | $PUBLISH |"
            echo ""
            echo "Run: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

          TITLE="⚠️ Daily pipeline failed: $EPISODE"
          if [ -n "$FAILED" ]; then
            if [ "$RETRY" = "true" ]; then
              RETRY_NOTE="本次已是自动重跑,不再继续重试,需要人工介入"
            else
              RETRY_NOTE="将自动重跑一次"
            fi
            BODY="日期: $EPISODE
          失败环节: $FAILED
          Run: $RUN_URL
          重试策略: $RETRY_NOTE"
            # 重跑派发必须先做:issue API 故障不能吞掉重试(Step Summary 已留档,告警降级为 best-effort)
            if [ "$RETRY" != "true" ]; then
              gh workflow run daily.yml --ref main -f date="$EPISODE" -f retry=true
              echo "已触发自动重跑: date=$EPISODE retry=true"
            fi
            FOUND=$(gh api -X GET search/issues -f q="repo:$GH_REPO in:title state:open \"Daily pipeline failed: $EPISODE\"" --jq '.items[0].number' 2>/dev/null || true)
            if [ -n "$FOUND" ]; then
              gh issue comment "$FOUND" --body "$BODY" || true
            else
              gh issue create --title "$TITLE" --body "$BODY" || true
            fi
          else
            for N in $(gh api -X GET search/issues -f q="repo:$GH_REPO in:title state:open \"Daily pipeline failed: $EPISODE\"" --jq '.items[].number' 2>/dev/null || true); do
              gh issue close "$N" -c "今日运行($EPISODE)全部成功,自动关闭。Run: $RUN_URL"
            done
          fi
