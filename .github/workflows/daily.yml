name: Daily Podcast

on:
  schedule:
    - cron: "43 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Episode date (YYYY-MM-DD), default is today"
        required: false
        type: string

permissions:
  contents: write

# 与 prune_pages.yml 共用同一并发组:两者都会 push main / 部署 gh-pages,
# 手动触发与定时运行不能同时跑,排队等待而不是并行竞争。
concurrency:
  group: podcast-pipeline
  cancel-in-progress: false

jobs:
  stage1:
    name: Stage 1 (fetch → process)
    runs-on: ubuntu-latest
    outputs:
      episode_id: ${{ steps.episode.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync --frozen

      - id: episode
        run: |
          INPUT_DATE="${{ github.event.inputs.date }}"
          if [ -n "$INPUT_DATE" ]; then
            echo "id=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            echo "id=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        env:
          TZ: Asia/Shanghai
        run: |
          EPISODE="${{ steps.episode.outputs.id }}"
          uv run podcast-pipeline --date "$EPISODE"

      - name: Commit brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          EPISODE="${{ steps.episode.outputs.id }}"
          git add data/briefs/
          if git diff --cached --quiet; then
            echo "No brief changes to commit"
          else
            git commit -m "daily: brief $EPISODE [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

  writer:
    name: Stage 3 (script generation)
    needs: stage1
    runs-on: ubuntu-latest
    outputs:
      episode_id: ${{ needs.stage1.outputs.episode_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest brief
        run: git pull origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate script
        env:
          TZ: Asia/Shanghai
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          EPISODE="${{ needs.stage1.outputs.episode_id }}"
          uv run podcast-writer --date "$EPISODE"

      - name: Commit script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          EPISODE="${{ needs.stage1.outputs.episode_id }}"
          git add -f site/episodes/${EPISODE}.txt
          if git diff --cached --quiet; then
            echo "No script changes to commit"
          else
            git commit -m "daily: script $EPISODE [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

  report:
    name: Stage 3b (daily report)
    needs: stage1
    runs-on: ubuntu-latest
    outputs:
      episode_id: ${{ needs.stage1.outputs.episode_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest brief
        run: git pull origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate daily report
        env:
          TZ: Asia/Shanghai
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          EPISODE="${{ needs.stage1.outputs.episode_id }}"
          uv run podcast-report --date "$EPISODE"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          EPISODE="${{ needs.stage1.outputs.episode_id }}"
          git add data/reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "daily: report $EPISODE [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

  tts:
    name: Stage 4 (TTS audio)
    needs: writer
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      episode_id: ${{ needs.writer.outputs.episode_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest content
        run: git pull origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y sox libsox-dev ffmpeg

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache CosyVoice
        uses: actions/cache@v4
        with:
          path: |
            ~/cosyvoice_src
            ~/cosyvoice_models
            ~/cosyvoice_venv
          key: cosyvoice-gha-v7

      - name: Setup CosyVoice environment
        run: bash scripts/setup_cosyvoice_env.sh

      - name: Synthesize episode audio
        env:
          TZ: Asia/Shanghai
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          EPISODE="${{ needs.writer.outputs.episode_id }}"
          export COSYVOICE_MODEL_DIR="$HOME/cosyvoice_models/CosyVoice2-0.5B"
          export PYTHONPATH="$HOME/cosyvoice_src:$HOME/cosyvoice_src/third_party/Matcha-TTS"
          # Stage 4: 使用 podcast-tts CLI，但需要特殊 Python 环境
          "$HOME/cosyvoice_venv/bin/python" scripts/gha_tts_cosyvoice.py \
            --script "site/episodes/${EPISODE}.txt" \
            --output "site/episodes/${EPISODE}.mp3" \
            --model-dir "$HOME/cosyvoice_models/CosyVoice2-0.5B"

      # 音频只通过 artifact 传递给 publish job，不提交到 main，避免 git 历史膨胀
      - name: Upload episode audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: episode-audio-${{ needs.writer.outputs.episode_id }}
          path: |
            site/episodes/${{ needs.writer.outputs.episode_id }}.mp3
            site/episodes/${{ needs.writer.outputs.episode_id }}/
          if-no-files-found: error

  publish:
    name: Stage 5 (publish site)
    needs: [tts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest content
        run: git pull origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download episode audio artifact
        uses: actions/download-artifact@v4
        with:
          name: episode-audio-${{ needs.tts.outputs.episode_id }}
          path: site/episodes

      - name: Publish feed and site
        env:
          TZ: Asia/Shanghai
        run: |
          EPISODE="${{ needs.tts.outputs.episode_id }}"
          uv run podcast-publish --date "$EPISODE"

      - name: Validate episode artifacts
        env:
          TZ: Asia/Shanghai
        run: |
          EPISODE="${{ needs.tts.outputs.episode_id }}"
          python3 - "$EPISODE" <<'PYEOF'
          import json
          import sys
          from pathlib import Path

          ep = sys.argv[1]
          mp3 = Path(f"site/episodes/{ep}.mp3")
          assert mp3.exists(), f"missing {mp3}"
          size = mp3.stat().st_size
          assert size > 100_000, f"mp3 too small: {size} bytes"
          feed = Path("site/feed.xml").read_text(encoding="utf-8")
          assert f"episodes/{ep}.mp3" in feed, "feed.xml missing episode enclosure"
          index = json.loads(Path("data/episodes.json").read_text(encoding="utf-8"))
          eps = index if isinstance(index, list) else index.get("episodes", [])
          assert any(str(e.get("id")) == ep for e in eps), "episodes.json missing entry"
          print(f"validated {ep}: mp3={size} bytes, feed+index ok")
          PYEOF

      - name: Commit site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          EPISODE="${{ needs.tts.outputs.episode_id }}"
          git add -u site/ data/episodes.json
          git add -f "site/reports/daily_report_${EPISODE}.md" 2>/dev/null || echo "No daily report for ${EPISODE}, skipped"
          git add -f "site/episodes/${EPISODE}/playlist.json" 2>/dev/null || echo "No playlist.json for ${EPISODE}, skipped"
          if git diff --cached --quiet; then
            echo "No site changes to commit"
          else
            git commit -m "daily: publish $EPISODE [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Remove .gitignore to ensure ignored files are deployed
        run: rm -f .gitignore

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true

      - name: Verify gh-pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          EPISODE="${{ needs.tts.outputs.episode_id }}"
          sleep 10
          SIZE=$(gh api "repos/$GH_REPO/contents/episodes/$EPISODE.mp3?ref=gh-pages" --jq '.size' 2>/dev/null || echo 0)
          echo "gh-pages $EPISODE.mp3 size: $SIZE"
          if [ "$SIZE" -le 100000 ]; then
            echo "::error::$EPISODE.mp3 missing or too small on gh-pages"
            exit 1
          fi
          PLAYLIST=$(gh api "repos/$GH_REPO/contents/episodes/$EPISODE/playlist.json?ref=gh-pages" --jq '.size' 2>/dev/null || echo 0)
          if [ "$PLAYLIST" -le 0 ]; then
            echo "::error::$EPISODE/playlist.json missing on gh-pages"
            exit 1
          fi
          echo "gh-pages reconciliation OK"
