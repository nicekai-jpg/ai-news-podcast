name: rsshub full sweep

# 诊断：按生产配置（同域 0.5s 间隔、20s 超时、3 次尝试）串行探测全部 C3 路由，
# 用于判断「失败」是路由坏了还是并发/超时导致的。

on:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    services:
      rsshub:
        image: ghcr.io/diygod/rsshub:latest
        ports:
          - 1200:1200
    steps:
      - uses: actions/checkout@v4

      - name: Wait for RSSHub
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:1200/healthz || true)
            if [ "$code" = "200" ]; then echo "ready after $i"; break; fi
            sleep 2
          done

      - name: Extract routes from config
        run: |
          grep -oE 'rsshub_route:[[:space:]]*"?[^"[:space:]#]+' config/sources_v3.yaml \
            | sed -E 's/rsshub_route:[[:space:]]*"?//' > /tmp/routes.txt
          wc -l < /tmp/routes.txt

      - name: Serial sweep prod-like
        run: |
          echo "| route | status | seconds | bytes |"
          echo "|---|---|---|---|"
          FAIL=0
          while read -r route; do
            [ -z "$route" ] && continue
            ok=""
            code="000"
            secs="0"
            for attempt in 1 2 3; do
              out=$(curl -s -o /tmp/b -w '%{http_code} %{time_total}' --max-time 20 "http://127.0.0.1:1200${route}" || echo "000 0")
              code=$(echo "$out" | awk '{print $1}')
              secs=$(echo "$out" | awk '{print $2}')
              if [ "$code" = "200" ]; then ok="$code"; break; fi
              sleep 1
            done
            if [ -z "$ok" ]; then FAIL=$((FAIL+1)); fi
            bytes=$(wc -c < /tmp/b 2>/dev/null || echo 0)
            echo "| ${route} | ${code} | ${secs} | ${bytes} |"
            sleep 0.5
          done < /tmp/routes.txt
          echo ""
          echo "FAILED_COUNT=${FAIL}"
