name: Daily Podcast v3

# 新链 Stage 1–7 的手动验证工作流：
# - 默认只跑完、上传产物，不部署 gh-pages、不提交 main；
# - 勾选 deploy 才部署并提交（与旧 daily.yml 串行，共享 podcast-pipeline 并发组）。
# 旧 daily.yml 保持不变，可随时回滚。
on:
  schedule:
    - cron: "30 17 * * *"   # 17:30 UTC ≈ 北京 01:30；GitHub 调度通常延迟 0–3h
  workflow_dispatch:
    inputs:
      date:
        description: "Episode date (YYYY-MM-DD), default is today"
        required: false
        type: string
      fulltext:
        description: "回源抓正文（定时任务默认开启；关闭仅用于快速验证）"
        required: false
        type: boolean
        default: true
      max_workers:
        description: "采集源级并发"
        required: false
        type: string
        default: "8"
      skip_script:
        description: "只跑到点评，不生成文稿/音频"
        required: false
        type: boolean
        default: false
      run_tts:
        description: "Run Stage 6 TTS (needs CosyVoice cache)"
        required: false
        type: boolean
        default: true
      run_publish:
        description: "Run Stage 7 publish (feed/site/episodes.json)"
        required: false
        type: boolean
        default: true
      deploy:
        description: "部署 gh-pages 并提交 main（默认仅校验）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read   # 下载历史 v3 artifact（Stage 2 跨日去重/连续性）

concurrency:
  group: podcast-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: "v3 Stage 1-7 (collect → ocean → recommend → report → report review → script → podcast review)"
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    services:
      rsshub:
        image: ghcr.io/diygod/rsshub:latest
        ports:
          - 1200:1200
    outputs:
      episode_id: ${{ steps.episode.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - id: episode
        run: |
          INPUT_DATE="${{ github.event.inputs.date }}"
          if [ -n "$INPUT_DATE" ]; then
            echo "id=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            echo "id=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch v3 history artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          uv run python scripts/fetch_v3_history.py --days 14 --exclude-run-id "$GITHUB_RUN_ID"

      - name: Wait for RSSHub
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:1200/healthz >/dev/null 2>&1; then
              echo "RSSHub ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::RSSHub not ready after 180s"
          exit 1

      - name: Run v3 Stage 1-7
        env:
          TZ: Asia/Shanghai
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EPISODE="${{ steps.episode.outputs.id }}"
          FULLTEXT="${{ github.event.inputs.fulltext }}"
          if [ -z "$FULLTEXT" ]; then FULLTEXT="true"; fi   # 定时任务默认回源：推荐标注需要全文
          WORKERS="${{ github.event.inputs.max_workers }}"
          if [ -z "$WORKERS" ]; then WORKERS="12"; fi
          EXTRA=""
          if [ "${{ github.event.inputs.skip_script }}" = "true" ]; then
            EXTRA="$EXTRA --skip-script"
          fi
          if [ "$FULLTEXT" = "false" ]; then
            EXTRA="$EXTRA --no-fulltext"
          fi
          uv run python -m ai_news_podcast.presentation.cli.podcast_v3_controller \
            --date "$EPISODE" \
            --rsshub-base http://127.0.0.1:1200 \
            --max-workers "$WORKERS" \
            $EXTRA

      - name: Check script quality
        if: ${{ github.event.inputs.skip_script != 'true' }}
        env:
          TZ: Asia/Shanghai
        run: |
          EPISODE="${{ steps.episode.outputs.id }}"
          if [ ! -s "site/episodes/${EPISODE}.txt" ]; then
            echo "::error::missing or empty script site/episodes/${EPISODE}.txt"
            exit 1
          fi
          uv run python - <<'PYEOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "src")
          from ai_news_podcast.business.editorial.script import quality
          ep = "${{ steps.episode.outputs.id }}"
          text = Path(f"site/episodes/{ep}.txt").read_text(encoding="utf-8")
          report = quality(text)
          print(f"script quality: ok={report.get('ok')} chars={report.get('chars')} chapters={report.get('chapters')}")
          if report.get("issues"):
              print("issues:", "；".join(report["issues"]))
              print("::warning::script quality issues (continue, see issues above)")
          PYEOF

      - name: Commit coverage ledger (cross-day state)
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' || github.event.inputs.deploy == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d data/coverage ]; then git add data/coverage; fi
          if git diff --cached --quiet; then
            echo "No coverage changes"
          else
            git commit -m "chore: update coverage ledger ${{ steps.episode.outputs.id }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload v3 pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v3-output-${{ steps.episode.outputs.id }}
          path: |
            data/raw/
            data/ocean/${{ steps.episode.outputs.id }}/
            data/selection/
            data/editorial/
            data/briefs/brief_${{ steps.episode.outputs.id }}.json
            data/coverage/
            site/episodes/${{ steps.episode.outputs.id }}.txt
          if-no-files-found: warn
          retention-days: 30

  tts:
    name: "v3 Stage 8 (TTS audio)"
    needs: pipeline
    if: ${{ github.event.inputs.run_tts != 'false' && github.event.inputs.skip_script != 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y sox libsox-dev ffmpeg

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download v3 artifacts
        uses: actions/download-artifact@v4
        with:
          name: v3-output-${{ needs.pipeline.outputs.episode_id }}
          path: .

      - name: Cache CosyVoice
        uses: actions/cache@v4
        with:
          path: |
            ~/cosyvoice_src
            ~/cosyvoice_models
            ~/cosyvoice_venv
          key: cosyvoice-gha-v7

      - name: Setup CosyVoice environment
        run: bash scripts/setup_cosyvoice_env.sh

      - name: Synthesize episode audio
        env:
          TZ: Asia/Shanghai
        run: |
          EPISODE="${{ needs.pipeline.outputs.episode_id }}"
          export COSYVOICE_MODEL_DIR="$HOME/cosyvoice_models/CosyVoice2-0.5B"
          export PYTHONPATH="$HOME/cosyvoice_src:$HOME/cosyvoice_src/third_party/Matcha-TTS"
          "$HOME/cosyvoice_venv/bin/python" scripts/gha_tts_cosyvoice.py \
            --script "site/episodes/${EPISODE}.txt" \
            --output "site/episodes/${EPISODE}.mp3" \
            --model-dir "$HOME/cosyvoice_models/CosyVoice2-0.5B"

      - name: Upload episode audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: episode-audio-${{ needs.pipeline.outputs.episode_id }}
          path: |
            site/episodes/${{ needs.pipeline.outputs.episode_id }}.mp3
            site/episodes/${{ needs.pipeline.outputs.episode_id }}/playlist.json
          if-no-files-found: error

  publish:
    name: "v3 Stage 9 (publish site)"
    needs: [pipeline, tts]
    if: ${{ github.event.inputs.run_publish != 'false' && github.event.inputs.skip_script != 'true' }}
    runs-on: ubuntu-22.04
    env:
      EPISODE: ${{ needs.pipeline.outputs.episode_id }}
      MIN_MP3_BYTES: '100000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download v3 artifacts
        uses: actions/download-artifact@v4
        with:
          name: v3-output-${{ needs.pipeline.outputs.episode_id }}
          path: .

      - name: Download episode audio artifact
        uses: actions/download-artifact@v4
        with:
          name: episode-audio-${{ needs.pipeline.outputs.episode_id }}
          path: site/episodes

      - name: Publish feed and site
        env:
          TZ: Asia/Shanghai
        run: uv run podcast-publish --date "$EPISODE"

      - name: Validate episode artifacts
        run: |
          python3 - "$EPISODE" <<'PYEOF'
          import json
          import os
          import sys
          from pathlib import Path

          ep = sys.argv[1]
          min_bytes = int(os.environ["MIN_MP3_BYTES"])
          mp3 = Path(f"site/episodes/{ep}.mp3")
          assert mp3.exists(), f"missing {mp3}"
          size = mp3.stat().st_size
          assert size > min_bytes, f"mp3 too small: {size} bytes"
          feed = Path("site/feed.xml").read_text(encoding="utf-8")
          assert f"episodes/{ep}.mp3" in feed, "feed.xml missing episode enclosure"
          index = json.loads(Path("data/episodes.json").read_text(encoding="utf-8"))
          eps = index if isinstance(index, list) else index.get("episodes", [])
          assert any(str(e.get("id")) == ep for e in eps), "episodes.json missing entry"
          print(f"validated {ep}: mp3={size} bytes")
          PYEOF

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: v3-publish-${{ needs.pipeline.outputs.episode_id }}
          path: |
            site/
            data/episodes.json
          if-no-files-found: error
          retention-days: 14

      # 只有显式勾选 deploy 才部署 + 提交 main（默认只校验，不污染生产）
      - name: Remove .gitignore to ensure ignored files are deployed
        if: ${{ github.event_name == 'schedule' || github.event.inputs.deploy == 'true' }}
        run: rm -f .gitignore

      - name: Deploy GitHub Pages
        if: ${{ github.event_name == 'schedule' || github.event.inputs.deploy == 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true

      - name: Commit site
        if: ${{ github.event_name == 'schedule' || github.event.inputs.deploy == 'true' }}
        run: |
          git restore .gitignore 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/briefs/ data/episodes.json
          if [ -d data/coverage ]; then git add data/coverage/; fi
          git add -u site/
          if [ -d site/data ]; then git add -f site/data/; fi
          if [ -f "site/episodes/${EPISODE}/playlist.json" ]; then
            git add -f "site/episodes/${EPISODE}/playlist.json"
          fi
          if git diff --cached --quiet; then
            echo "No site changes to commit"
          else
            git commit -m "daily: publish $EPISODE [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

  notify:
    name: "Notify"
    needs: [pipeline, tts, publish]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Write job summary
        run: |
          echo "## Daily Podcast v3 · ${{ needs.pipeline.outputs.episode_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| job | result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| pipeline S1-S7 | ${{ needs.pipeline.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| tts S8 | ${{ needs.tts.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| publish S9 | ${{ needs.publish.result }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Open failure issue
        if: ${{ contains(needs.*.result, 'failure') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          EP="${{ needs.pipeline.outputs.episode_id }}"
          if [ -z "$EP" ]; then EP=$(TZ=Asia/Shanghai date +%F); fi
          TITLE="⚠️ v3 pipeline failed: $EP"
          BODY="pipeline=${{ needs.pipeline.result }} tts=${{ needs.tts.result }} publish=${{ needs.publish.result }}"
          BODY="$BODY"$'\n\nrun: '"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NUMBER=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
