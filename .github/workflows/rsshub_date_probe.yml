name: rsshub date probe

# 诊断：抓取 feed 并打印条目发布时间，判断空源是「文章太旧」还是「解析失败」。

on:
  workflow_dispatch:
    inputs:
      routes:
        description: "空格分隔的路由"
        required: false
        type: string
        default: "/meta/ai/blog /mistral/news /kimi/blog /groq/blog /minimax/news/zh-CN /anthropic/research"

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      rsshub:
        image: ghcr.io/diygod/rsshub:latest
        ports:
          - 1200:1200
    steps:
      - name: Wait for RSSHub
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:1200/healthz || true)
            if [ "$code" = "200" ]; then echo "ready"; break; fi
            sleep 2
          done

      - name: Inspect feed dates
        run: |
          for route in ${{ github.event.inputs.routes }}; do
            echo "=== ${route} ==="
            curl -s --max-time 40 "http://127.0.0.1:1200${route}" -o /tmp/feed.xml
            echo "  bytes: $(wc -c < /tmp/feed.xml)"
            echo "  entries: $(grep -c '<item' /tmp/feed.xml || true)"
            echo "  first dates:"
            grep -oE '<(pubDate|updated|published|dc:date)>[^<]+' /tmp/feed.xml \
              | sed 's/<[a-zA-Z:]*>//' | head -5 | sed 's/^/    /'
            echo "  first titles:"
            grep -oE '<title>[^<]+' /tmp/feed.xml | sed 's/<title>//' | sed -n '2,4p' | sed 's/^/    /'
          done
