name: Prune GitHub Pages History

on:
  schedule:
    # 每月 1 号 12:00 UTC 运行，避开 Daily Podcast 窗口 (21:43 UTC 起，约 2-3 小时)
    - cron: "0 12 1 * *"
  workflow_dispatch:     # Allow manual trigger from GitHub UI

permissions:
  contents: write

# 与 daily.yml 共用同一并发组:prune 会 force-push gh-pages,
# 不能和正在运行的 daily(也会 push main / 部署 gh-pages)重叠。
concurrency:
  group: podcast-pipeline
  cancel-in-progress: false

jobs:
  prune:
    name: Prune gh-pages branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Run gh-pages Pruning Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/prune_gh_pages.py
