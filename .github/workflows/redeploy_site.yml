name: Redeploy Site

# Rebuild index.html / feed.xml / reports from data/episodes.json and deploy to
# gh-pages WITHOUT re-running the audio pipeline. Handy for front-end changes.
# Audio, show-notes HTML and chunk dirs are preserved via keep_files.

on:
  workflow_dispatch:

concurrency:
  group: podcast-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  redeploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Pull latest content
        # 与 daily 共用并发组会排队；排队中的 run 用的是入队时的 SHA，
        # 不再 pull 一次可能用旧树重建、把当天 feed 覆盖回去
        run: git pull origin main

      - name: Install dependencies
        run: uv sync --frozen

      - name: Rebuild site pages
        env:
          TZ: Asia/Shanghai
        run: uv run python scripts/redeploy_site.py

      - name: Remove .gitignore to ensure ignored files are deployed
        run: rm -f .gitignore

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true

      # 把重建后的 site/ 提交回 main：否则 main 上还是旧版 index/feed/digest，
      # 月度 prune 从 main 重建 gh-pages 时会把刚部署的新前端覆盖回旧版
      - name: Commit rebuilt site to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u site/
          if [ -d site/data ]; then git add -f site/data/; fi
          if [ -d site/reports ]; then git add -f site/reports/; fi
          if [ -d site/radar ]; then git add -f site/radar/; fi
          if git diff --cached --quiet; then
            echo "No site changes to commit"
          else
            git commit -m "chore(site): redeploy rebuild [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
