  - id: healthcare
    name: 医疗健康
    ai_related: none
    keywords: [医疗, 医院, 药企, 临床]

  - id: education
    name: 教育
    ai_related: none
    keywords: [教育, 学校, 课程, 考试]

  - id: policy
    name: 政策与社会
    ai_related: none
    keywords: [政策, 监管, 法案, 政府, 政治, 社会, 事故]

  - id: other
    name: 其他
    ai_related: none
    keywords: []
