# 行业/领域词表（穷举式，先定骨架再补词）
#
# 字段：
#   id           规范 id
#   name         展示名
#   parent       上级行业（没有则省略）
#   ai_related   AI 相关性：core=AI 本体，infra=AI 基础设施，application=AI 应用，none=非 AI
#   keywords     命中这些词归入该行业（标题优先）

version: 1

industries:
  - id: ai
    name: 人工智能
    ai_related: core
    keywords: [AI, 人工智能, 大模型, 模型, LLM, Agent, 智能体, 生成式, AIGC, 机器学习]

  - id: semiconductors
    name: 半导体
    ai_related: infra
    keywords: [芯片, 半导体, GPU, 算力, 英伟达, 光刻, 晶圆]

  - id: robotics
    name: 机器人
    ai_related: infra
    keywords: [机器人, 人形机器人, 具身智能, 机械臂]

  - id: autonomous_driving
    name: 自动驾驶
    ai_related: infra
    keywords: [自动驾驶, 智能驾驶, 无人驾驶, Robotaxi]

  - id: cloud_data
    name: 云与数据中心
    ai_related: infra
    keywords: [云计算, 数据中心, 智算中心, 服务器]

  - id: ai_application
    name: AI 应用
    parent: ai
    ai_related: application
    keywords: [编程助手, AI 医疗, AI 金融, AI 教育, AI 搜索, AI 办公]

  - id: automotive
    name: 汽车
