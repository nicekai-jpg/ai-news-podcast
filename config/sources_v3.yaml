# Stage 1 采集源清单（通道化定稿 v1.0，2026-11-09）
#
# 依据：docs/source_channels.md §4.8（C3 定稿）、§5.0（C4 定稿）、§6（C5 定稿）、
#       docs/source_pipeline_design.md §3（通道总表）。
#
# 源数量：共 132 条（跨通道重复按条目计），其中启用 122。2026-11-10 生产化调整：
#   - 6 个慢/不稳的 RSSHub 路由改走原生 RSS（transformer-circuits/bloomberg/geekpark/
#     ifanr/engadget/oschina）；9 个确认失败且无原生替代的源 enabled:false；
#   - GHA 定时任务关闭回源全文（--no-fulltext），控制单次时长。
#
#   C1 c1_rss          34（31 + 6 个改原生 - 3 个禁用）
#   C2 c2_atom         11 = GitHub Releases 8 + YouTube 3
#   C3 c3_rsshub       53（66 - 6 改原生 - 7 禁用）
#   C4 c4_web           7 = DeepSeek / 智谱 / MiniMax / 字节 Seed / 商汤 / 工信部 / 网信办
#   C5 c5_wechat2rss   17 = 机器之心…得物技术（公共 wechat2rss feed，含 content:encoded 全文）
#
# 说明与取舍：
# 1. docs/source_channels.md §4.8 的一级表实际列了 40 行（4.7 的 38 + DeepMind + PixelsTech），
#    但章节标题/总量按「一级 38」计。本文件以 66 总量为准：DeepMind 路由超时且 C1 原生 RSS
#    覆盖（§4.8 亦标注），Podwise 为播客探索榜且无发布时间（无法进 72h 窗口），二者不重复接入；
#    PixelsTech 与 4.7 全量一级源保留。
# 2. 三级 22 个源的 RSSHub 路由按镜像命名空间约定填写，上线前建议对照部署镜像的
#    /app/assets/build/routes.json 复核；单源路由失效只会记录 failed，不影响其它源。
# 3. C4 的 5 个 SPA 源（Kimi/文心/混元/阶跃/讯飞）与 Telegram 频道按 §5.0 结论暂不接入。
# 4. C4 列表页默认用「锚点 + 邻近日期」启发式解析；若某站改版，可在该源下加
#    selectors: {item: "...", title: "...", link: "...", date: "...", summary: "..."}
#    精确指定（parser: generic 时生效）。
# 5. 字段：name 唯一 slug / label 展示名 / channel 通道 / url 或 urls 或 rsshub_route /
#    category 来源类别（official|news|research|community|video|podcast）/ limit 单源条数上限 /
#    enabled / failover（主通道失败时的一次性备用抓取）。
# 6. 采集端只做 URL 规范化、同源内去重、72h 时效过滤、条数上限；跨源去重与
#    重要性判断全部交给 Stage 2。
#
# 所有 URL 只是「入口」，正文由采集时一次性抓全（feed content:encoded / readability）。

