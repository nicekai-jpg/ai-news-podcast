# 主题域/相关性词表（可维护）
#
# 用法：发现新的非 AI 类目或 AI 核心词，直接加到这里；改完跑：
#   uv run python -m pytest tests/test_ocean_domain.py tests/test_ocean_relevance.py -q
#
# 说明：
# - ai_core_extra 追加到内置 AI 核心词（模型/Agent/LLM/论文等）；
# - ai_infra_extra 追加到 AI 基础设施词（芯片/算力/机器人等）；
# - ai_driving 优先于汽车类目词（自动驾驶/智能驾驶等）；
# - other_category 命中即判非 AI（汽车、金融、消费、体育、娱乐、社会等）；
# - auto_brands 汽车品牌：标题带品牌不等于 AI（除非同时有 ai_driving）。

version: 1

ai_core_extra:
  - diffusion
  - tokenizer
  - tokenization
  - alignment
  - distillation
