# 新流水线（Stage 1–7）全局配置
# 各 Stage 的算法阈值在各自配置里：
#   config/ocean_v3.yaml（Stage 2）、config/recommend_v3.yaml（Stage 3）、
#   config/editorial_v3.yaml（Stage 4/5）；源清单在 config/sources_v3.yaml。
pipeline:
  timezone: Asia/Shanghai
  artifact_retention_days: 30
  raw_dir: "data/raw"
  ocean_dir: "data/ocean"
  selection_dir: "data/selection"
  editorial_dir: "data/editorial"
  coverage_ledger: "data/coverage/ledger.json"
  history_days: 30

stage1:
  window_hours: 72
  per_source_limit: 15
  http_timeout: 20
  retries: 2
  fetch_fulltext: true   # 关闭可显著加速（正文/证据质量下降），GHA 快速验证可传 --no-fulltext
  max_workers: 8

stage4:
  report_top_n: 5

stage5:
  target_minutes: 15

# 各 Stage 使用的模型；未列出的 Stage 用 config.yaml 里的 llm.model。
# M3.1 Flash 已发布（2026-10-19），先用 M3 跑通，A/B 后再切 stage2/stage3。
llm:
  stage_models:
    stage2: "MiniMax-M3.1-Flash"
    stage3: "MiniMax-M3.1-Flash"
    stage4: "MiniMax-M3.1-Flash"   # S4 日报生成
    stage5: "MiniMax-M3.1-Flash"   # S5 日报点评
    stage6: "MiniMax-M3.1-Flash"   # S6 播客文稿生成
    stage7: "MiniMax-M3.1-Flash"   # S7 播客点评
  # 价格（元/百万 tokens），用于每期费用估算
  pricing:
    MiniMax-M3.1-Flash:
      input: 1.00
      output: 4.00
  # 按 Stage 覆盖生成参数；stage5 需要更大 token 预算（长文稿 + 思考 token）
  # 关键：Flash 是推理模型，长 prompt 需要更大 token 预算与超时；低预算会空输出。
  stage_options:
    stage3:
      temperature: 0.2
      max_output_tokens: 24576
      timeout: 300        # 20 条事件实测 ~170s
    stage4:                 # S4 日报生成
      temperature: 0.3
      max_output_tokens: 8192
      timeout: 240
    stage5:                 # S5 日报点评（一次审读全部日报）
      temperature: 0.2
      max_output_tokens: 16384
      timeout: 300
    stage6:                 # S6 播客文稿（长文稿）
      temperature: 0.4
      max_output_tokens: 24576   # 实测 reasoning 已达 19k tokens，16k 会偶发空输出
      timeout: 600        # 长文稿实测 ~230–430s
    stage7:                 # S7 播客点评 + show notes
      temperature: 0.3
      max_output_tokens: 16384
      timeout: 300
